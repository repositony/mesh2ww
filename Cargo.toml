[package]
authors      = ["Tony <repositony@outlook.com>"]
description  = "Command line tool to generate mesh-based weight windows"
edition      = "2021"
keywords     = ["mcnp", "mesh", "variance-reduction"]
license      = "GPL-3.0 license"
name         = "mesh2ww"
readme       = "readme.md"
repository   = "https://github.com/repositony/mesh2ww"
rust-version = "1.82"
version      = "1.0.0"

[dependencies]
ntools = { git = "ssh://git@github.com/repositony/ntools.git", branch = "main", features = [
    "mesh",
    "weights",
    "wwgen",
] }

# core library, not currently for public use
# external
anyhow    = "1.0.94"
bincode   = "1.3.3"
clap      = { version = "4.5.23", features = ["derive", "wrap_help"] }
log       = "0.4.22"
serde     = "1.0.216"
stderrlog = "0.6.0"
vtkio     = { git = "https://github.com/elrnv/vtkio.git", rev = "2432be9" }

[lints.rust]
unsafe_code = "forbid"

[[bin]]
doc  = false
name = "mesh2ww"

[profile.dist]
allow-dirty = ["ci", "msi"]
inherits    = "release"
lto         = "thin"
